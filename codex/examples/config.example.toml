#:schema https://developers.openai.com/codex/config-schema.json
# Public Codex configuration example.
# Optional recipes and verification: ../../docs/codex-configuration-guidance.md (repository path).
# Versioned validation evidence: ../../docs/compatibility.md.
# Merge into $CODEX_HOME/config.toml manually (default: ~/.codex/config.toml). Do not overwrite an existing config blindly.

# Recommended for demanding research/design work; confirm both models are available to your account.
model = "gpt-6-astra"
model_provider = "openai"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
developer_instructions = "Respond clearly, precisely, and with evidence when facts are uncertain."

project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536
tool_output_token_limit = 10000

hide_agent_reasoning = true
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "high"
# Standard processing remains the default when service_tier is omitted.
# Select Fast through the UI/command or an explicit service-tier setting only when the active model advertises it.

# Live search is appropriate when current external evidence matters. Use cached or indexed
# instead when freshness is not required or external retrieval should be more constrained.
web_search = "live"

check_for_update_on_startup = true

[shell_environment_policy]
inherit = "all"
# Keep Codex's default KEY/SECRET/TOKEN name filtering enabled while inheriting
# the rest of the parent shell environment.
ignore_default_excludes = false

[sandbox_workspace_write]
# Leave shell-command network access disabled by default. The built-in web_search tool is separate.
network_access = false

[features]
memories = true
unified_exec = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 10000
default_wait_timeout_ms = 60000
max_wait_timeout_ms = 120000

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

[agents.default]
description = "General-purpose helper."

[agents.worker]
description = "Drafts or edits scoped document content and configuration files."

[agents.explorer]
# "Read-only" is task guidance; this description does not enforce a sandbox.
# Subagents inherit the parent turn's permissions; role files do not establish
# an independent read-only permission boundary.
description = "Read-only exploration: searches, reads, maps documents, sources, and references."

[agents.awaiter]
description = "Monitors long-running document conversion, validation, export, or research commands."

[agents.reviewer]
description = "Reviews documents, designs, standards, or evidence against quality gates."

[analytics]
enabled = false

# --- MCP Servers ---
# Recommended pair: DeepWiki for public repository research; Tavily for web search/extraction.
# Enable deliberately after reviewing data flow and configuring authentication.
# Reuse an existing App/connector/plugin instead of registering a duplicate server.

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
enabled = false
enabled_tools = ["read_wiki_structure", "read_wiki_contents", "ask_wiki_question"]

[mcp_servers.tavily]
url = "https://mcp.tavily.com/mcp"
bearer_token_env_var = "TAVILY_API_KEY"
enabled = false
tool_timeout_sec = 120
enabled_tools = ["tavily_search", "tavily_extract"]

# Optional specialist servers. See README.md in this directory for selection and setup.
# npm MCP packages remain unpinned; verify the resolved version and Node.js requirements.

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = false
tool_timeout_sec = 60
env_vars = ["CONTEXT7_API_KEY"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = false
enabled_tools = ["search_openai_docs", "fetch_openai_doc", "get_openapi_spec"]

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"
enabled = false
enabled_tools = ["microsoft_docs_search", "microsoft_docs_fetch", "microsoft_code_sample_search"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]
enabled = false
tool_timeout_sec = 120

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp"]
enabled = false

# Sequential Thinking, Brave Search, and third-party ACE relays are intentionally
# omitted from the default example: the first two duplicate existing reasoning or
# search capabilities, while ACE requires a separate code-data-flow and trust review.
